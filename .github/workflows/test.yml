name: Test

# Manual only: the workflow is never started by a push or pull request.
"on":
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The submodule is recorded with the upstream SSH URL. CI has no Bitbucket key,
# so every job rewrites it to HTTPS before checking it out.
jobs:
  test-macos:
    name: Test macOS (JVM + Apple + web)
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Check out the x264 submodule
        run: git submodule update --init --recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install latest
          "$HOME/emsdk/emsdk" activate latest
          echo "EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"

      - name: Run JVM, native and web tests
        run: >
          ./gradlew --no-daemon --stacktrace
          :x264-kmp:jvmTest
          :x264-kmp:macosArm64Test
          :x264-kmp:jsNodeTest
          :x264-kmp:wasmJsNodeTest

      - name: Compile the remaining Apple targets
        run: >
          ./gradlew --no-daemon --stacktrace
          :x264-kmp:compileKotlinMacosX64
          :x264-kmp:compileKotlinIosArm64
          :x264-kmp:compileKotlinIosX64
          :x264-kmp:compileKotlinIosSimulatorArm64
          :x264-kmp:compileKotlinTvosArm64
          :x264-kmp:compileKotlinTvosSimulatorArm64
          :x264-kmp:compileKotlinWatchosArm64
          :x264-kmp:compileKotlinWatchosSimulatorArm64
          :x264-kmp:compileKotlinWatchosDeviceArm64

      - name: Link the native example for macOS
        run: ./gradlew --no-daemon --stacktrace :examples:android-native:linkDebugExecutableMacosArm64

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"

      - name: Build the browser example
        run: ./gradlew --no-daemon --stacktrace :examples:browser:jsBrowserDistribution

      - name: Publish to Maven Local
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :x264-kmp:publishToMavenLocal
          -x :x264-kmp:publishAndroidPublicationToMavenLocal
          -x :x264-kmp:publishLinuxX64PublicationToMavenLocal
          -x :x264-kmp:publishLinuxArm64PublicationToMavenLocal
          -x :x264-kmp:publishMingwX64PublicationToMavenLocal
          -x :x264-kmp:publishAndroidNativeArm64PublicationToMavenLocal
          -x :x264-kmp:publishAndroidNativeArm32PublicationToMavenLocal
          -x :x264-kmp:publishAndroidNativeX64PublicationToMavenLocal
          -x :x264-kmp:publishAndroidNativeX86PublicationToMavenLocal
          :jni-jvm-darwin-aarch64:publishToMavenLocal
          :jni-jvm-darwin-x86_64:publishToMavenLocal

      - name: Verify Maven Local artifacts
        run: |
          REPO="$HOME/.m2/repository/cn/enaium/x264"
          JVM_POM="$REPO/x264-kmp-jvm/0.165.0.1/x264-kmp-jvm-0.165.0.1.pom"
          JNI_JAR="$REPO/x264-kmp-jni-jvm-darwin-aarch64/0.165.0.1/x264-kmp-jni-jvm-darwin-aarch64-0.165.0.1.jar"
          test -f "$JVM_POM" || { echo "FAIL: JVM POM missing"; exit 1; }
          grep -q "x264-kmp-jni-jvm-darwin-aarch64" "$JVM_POM" || { echo "FAIL: JVM POM lacks JNI runtime dependency"; exit 1; }
          test -f "$JNI_JAR" || { echo "FAIL: darwin JNI jar missing"; exit 1; }
          unzip -l "$JNI_JAR" | grep -q "libx264_jni.dylib" || { echo "FAIL: dylib missing from JNI jar"; exit 1; }
          test -n "$(find "$REPO" -name '*.klib' -print -quit)" || { echo "FAIL: no Apple/web klib published"; exit 1; }
          for artifact in \
            x264-kmp-jvm \
            x264-kmp-macosarm64 x264-kmp-macosx64 \
            x264-kmp-iosarm64 x264-kmp-iosx64 x264-kmp-iossimulatorarm64 \
            x264-kmp-tvosarm64 x264-kmp-tvossimulatorarm64 \
            x264-kmp-watchosarm64 x264-kmp-watchossimulatorarm64 x264-kmp-watchosdevicearm64 \
            x264-kmp-js x264-kmp-wasm-js; do
            if [ ! -d "$REPO/$artifact/0.165.0.1" ]; then
              echo "FAIL: missing Maven Local artifact $artifact"
              exit 1
            fi
          done
          echo "OK: Maven Local artifacts present; klibs=$(find "$REPO" -name '*.klib' | wc -l)"

  test-linux:
    name: Test Linux (JVM + Linux + cross + Android)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Check out the x264 submodule
        run: git submodule update --init --recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install cross-compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu \
            gcc-mingw-w64-x86-64

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "platforms;android-37.1" "ndk;27.0.12077973" >/dev/null

      - name: Run JVM, Linux, Android host and cross-target tests
        run: >
          ./gradlew --no-daemon --stacktrace
          :x264-kmp:jvmTest
          :x264-kmp:linuxX64Test
          :x264-kmp:testAndroidHostTest
          :x264-kmp:linkDebugTestMingwX64
          :x264-kmp:linkDebugTestLinuxArm64
          :x264-kmp:compileKotlinLinuxArm64
          --continue

      - name: Assemble the Android examples
        run: >
          ./gradlew --no-daemon --stacktrace
          :examples:android-jvm:assembleDebug
          :examples:android-native:android:assembleDebug

      - name: Verify the native example APK
        run: |
          APK="examples/android-native/android/build/outputs/apk/debug/android-debug.apk"
          test -f "$APK" || { echo "FAIL: native example APK missing"; exit 1; }
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            unzip -l "$APK" | grep -q "lib/$abi/libmain.so" || { echo "FAIL: APK lacks $abi libmain.so"; exit 1; }
            unzip -l "$APK" | grep -q "lib/$abi/libc++_shared.so" || { echo "FAIL: APK lacks $abi libc++_shared.so"; exit 1; }
          done
          echo "OK: libmain.so and libc++_shared.so for every ABI"

      - name: Verify the JNI library per ABI
        run: |
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            lib="x264-kmp/build/jniLibs/$abi/libx264_jni.so"
            echo "=== $abi: $lib ==="
            if [ ! -f "$lib" ]; then
              echo "FAIL: no JNI library for $abi"
              exit 1
            fi
            echo "OK: $(du -h "$lib" | cut -f1)"
          done

      - name: Verify the static archives
        run: |
          for target in linuxX64 linuxArm64 mingwX64; do
            archive="x264-kmp/build/native/$target/libx264_kmp.a"
            echo "=== $target: $archive ==="
            if [ ! -f "$archive" ]; then
              echo "FAIL: no static archive for $target"
              exit 1
            fi
            echo "OK: $(du -h "$archive" | cut -f1)"
          done

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"

      - name: Publish to Maven Local
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :x264-kmp:publishAndroidPublicationToMavenLocal
          :x264-kmp:publishLinuxX64PublicationToMavenLocal
          :x264-kmp:publishLinuxArm64PublicationToMavenLocal
          :x264-kmp:publishMingwX64PublicationToMavenLocal
          :x264-kmp:publishAndroidNativeArm64PublicationToMavenLocal
          :x264-kmp:publishAndroidNativeArm32PublicationToMavenLocal
          :x264-kmp:publishAndroidNativeX64PublicationToMavenLocal
          :x264-kmp:publishAndroidNativeX86PublicationToMavenLocal
          :jni-jvm-linux-x86_64:publishToMavenLocal
          :jni-jvm-linux-aarch64:publishToMavenLocal

      - name: Verify Maven Local artifacts
        run: |
          REPO="$HOME/.m2/repository/cn/enaium/x264"
          AAR=$(find "$REPO" -path "*x264-kmp-android/0.165.0.1/*.aar" -print -quit)
          test -n "$AAR" || { echo "FAIL: Android AAR missing"; exit 1; }
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            unzip -l "$AAR" | grep -q "jni/$abi/libx264_jni.so" || {
              echo "FAIL: AAR lacks $abi JNI library"
              exit 1
            }
          done
          JNI_JAR="$REPO/x264-kmp-jni-jvm-linux-x86_64/0.165.0.1/x264-kmp-jni-jvm-linux-x86_64-0.165.0.1.jar"
          test -f "$JNI_JAR" || { echo "FAIL: linux JNI jar missing"; exit 1; }
          unzip -l "$JNI_JAR" | grep -q "libx264_jni.so" || { echo "FAIL: .so missing from linux JNI jar"; exit 1; }
          test -n "$(find "$REPO" -name '*.klib' -print -quit)" || { echo "FAIL: no Linux/MinGW klib published"; exit 1; }
          for artifact in \
            x264-kmp-android \
            x264-kmp-linuxx64 x264-kmp-linuxarm64 \
            x264-kmp-mingwx64 \
            x264-kmp-androidnativearm64 x264-kmp-androidnativearm32 \
            x264-kmp-androidnativex64 x264-kmp-androidnativex86; do
            if [ ! -d "$REPO/$artifact/0.165.0.1" ]; then
              echo "FAIL: missing Maven Local artifact $artifact"
              exit 1
            fi
          done
          echo "OK: Android AAR, Linux JNI and klibs present"

  test-windows:
    name: Test Windows (JVM + MinGW)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Check out the x264 submodule
        run: git submodule update --init --recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install MinGW
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run JVM and MinGW tests
        run: ./gradlew --no-daemon --stacktrace :x264-kmp:jvmTest :x264-kmp:mingwX64Test

      - name: Verify the Windows JNI library
        shell: pwsh
        run: |
          $dll = "jni/jvm/windows-x86_64/build/jni-native/windows-x86_64/x264_jni.dll"
          if (!(Test-Path $dll)) { throw "Missing $dll" }
          Write-Output "OK: $((Get-Item $dll).Length) bytes"

      - name: Decode signing key
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes(
            "$env:RUNNER_TEMP\signing-key.gpg",
            [Convert]::FromBase64String("${{ secrets.SIGNING_KEY }}")
          )

      - name: Publish to Maven Local
        shell: cmd
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}\signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :jni-jvm-windows-x86_64:publishToMavenLocal

      - name: Verify Maven Local artifact
        shell: pwsh
        run: |
          $jar = Join-Path $env:USERPROFILE ".m2\repository\cn\enaium\x264\x264-kmp-jni-jvm-windows-x86_64\0.165.0.1\x264-kmp-jni-jvm-windows-x86_64-0.165.0.1.jar"
          if (!(Test-Path $jar)) { throw "Missing $jar" }
          $entries = & jar tf $jar
          if (-not ($entries -match "x264_jni.dll")) { throw "x264_jni.dll missing from $jar" }
          Write-Output "OK: Maven Local JNI jar contains x264_jni.dll"
